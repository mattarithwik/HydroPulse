[project]
name = "hydropulse"
version = "0.1.0"
description = "Local, evidence-aware river forecasting platform"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==2.3.3",
  "pydantic-settings==2.10.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.10",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
data = ["duckdb==1.3.2", "pyarrow==21.0.0", "xarray==2025.8.0", "zarr==3.1.2"]
ml = ["scikit-learn==1.7.2", "xgboost==3.0.5", "torch==2.9.0", "mlflow==3.3.2"]
stream = ["kafka-python==2.2.15"]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "ruff==0.12.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydropulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
