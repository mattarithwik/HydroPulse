name: hydropulse
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: hydropulse, POSTGRES_USER: hydropulse, POSTGRES_PASSWORD: hydropulse}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U hydropulse], interval: 5s, timeout: 3s, retries: 20}
    deploy: {resources: {limits: {memory: 1G}}}
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment: {HYDROPULSE_DATABASE_URL: postgresql+psycopg://hydropulse:hydropulse@postgres/hydropulse, HYDROPULSE_INGESTION_MODE: "${HYDROPULSE_INGESTION_MODE:-direct}", HYDROPULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092, HYDROPULSE_OPERATOR_TOKEN: "${HYDROPULSE_OPERATOR_TOKEN:-local-development-token}"}
    volumes: [./data:/app/data, ./artifacts:/app/artifacts]
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
    deploy: {resources: {limits: {memory: 768M}}}
  ui:
    build: {context: ., dockerfile: docker/ui.Dockerfile}
    depends_on: [api]
    ports: ["127.0.0.1:${HYDROPULSE_UI_PORT:-8080}:80"]
    deploy: {resources: {limits: {memory: 128M}}}
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
    deploy: {resources: {limits: {memory: 256M}}}
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports: ["127.0.0.1:3000:3000"]
    deploy: {resources: {limits: {memory: 256M}}}
  kafka:
    image: apache/kafka:4.0.0
    profiles: [streaming]
    environment: {KAFKA_NODE_ID: 1, KAFKA_PROCESS_ROLES: "broker,controller", KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093", KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1, KAFKA_LOG_RETENTION_HOURS: 168, KAFKA_LOG_RETENTION_BYTES: 1073741824}
    deploy: {resources: {limits: {memory: 768M}}}
  spark:
    build: {context: ., dockerfile: docker/spark.Dockerfile}
    profiles: [streaming]
    depends_on: [kafka]
    environment: {HYDROPULSE_DATABASE_URL: postgresql+psycopg://hydropulse:hydropulse@postgres/hydropulse, HYDROPULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092, HYDROPULSE_SPARK_CHECKPOINT: /app/data/spark-checkpoints/observations}
    volumes: [./data:/app/data]
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--conf", "spark.jars.ivy=/tmp/.ivy2", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6", "/app/src/hydropulse/spark_stream.py"]
    deploy: {resources: {limits: {memory: 1536M}}}
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    profiles: [ml]
    command: [mlflow, server, --host, 0.0.0.0, --backend-store-uri, postgresql+psycopg://hydropulse:hydropulse@postgres/hydropulse, --default-artifact-root, /artifacts]
    volumes: [./artifacts:/artifacts]
    depends_on: [postgres]
    ports: ["127.0.0.1:5000:5000"]
    deploy: {resources: {limits: {memory: 768M}}}
volumes: {postgres-data: {}}
